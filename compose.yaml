services:
  api:
    init: true
    restart: unless-stopped
    stop_grace_period: 130s
    mem_limit: ${OCEAN_API_MEMORY:-2g}
    cpus: ${OCEAN_API_CPUS:-2}
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - ocean-data:/app/data/imports
    environment:
      OCEAN_DATA_DIR: /app/data/imports
      OCEAN_MODE: writable
      OCEAN_WORKERS: '1'
      OCEAN_MAX_ACTIVE: ${OCEAN_MAX_ACTIVE:-6}
      OCEAN_SYNC_ENABLED: ${OCEAN_SYNC_ENABLED:-true}
      OCEAN_SYNC_INTERVAL: ${OCEAN_SYNC_INTERVAL:-21600}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - '${OCEAN_HTTP_BIND:-127.0.0.1}:${OCEAN_HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  ocean-data:
