upstream ocean_science {
  server api:8000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 51m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Request-ID $request_id always;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
  location /api/ {
    proxy_pass http://ocean_science;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    # Preserve 401/403/503 responses and Retry-After; never substitute index.html.
    proxy_intercept_errors off;
  }
  location = /index.html { expires -1; }
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location /demo/ { try_files $uri =404; expires -1; }
  location /incois/ { try_files $uri =404; expires -1; }
}
